# dsh-subprocess-sftp 的 bundle 层:把执行世界整体挪到远程。
#
# 为什么只换 subprocess 就够:
#   `LocalBashExecutor` 是 ctx.subprocess 的**消费方** —— run() 就是
#   spawn(['bash','-c',command], cwd=workdir)。subprocess 一远程化,
#   bash 工具自动远程;glob/grep 也走 ctx.subprocess.spawn([rgPath,...]),
#   同样跟着远程。所以不需要重写 ShellExecutor。
#
# 注意:本包必须与 dsh-bash-sftp **一起装**。只装这个的话,bash-sandbox 仍挂在
# 上面,它会把命令包成本机的 sandbox-exec,而远程没有那个程序。
- id: subprocess
  disabled: true

- insert:
    - id: subprocess-sftp
      name: 'dsh-subprocess-sftp'
