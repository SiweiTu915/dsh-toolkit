# dsh-bash-sftp 的 bundle 层:换掉默认 bash 执行器,并让权限预置表认得它。
#
# 1. 换掉 bash-sandbox:它的沙箱是**本机**语义(confine 本机进程),在远程世界里
#    既无意义,还会把命令包成本机的 sandbox-exec(远程没有该程序)。换成
#    dsh-bash-sftp —— 执行仍由远程 subprocess 承担,它只如实汇报 sandboxMode。
#
# 2. 补 permission 预置表:permission-presets 的推导是
#      (ctx.shell.sandboxMode, ctx.approval.policy) → 表里找匹配项
#    远程 bash 如实汇报 danger-full-access(远程命令确实不受本机约束),而 approval
#    是 ask,基线表里没有 (danger-full-access, ask) 这一对,推导会落到保留值
#    "custom" 并直接抛错 —— 所以必须显式补上这一条,否则整个组合启动失败。
#
#    ⚠️ 三档在远程世界的**实际含义**要说清(描述里也写了):
#      · read-only / workspace-write 由 **dsh-fs-sftp 的 per-call 围栏**执行,
#        即只约束文件工具(read / write / edit);
#      · shell 命令不经过 fs 接缝,远程命令本身不受这三档约束 —— 它由审批策略兜底。
#    之所以不把 shell 也纳入,是因为那需要在远程机上真的搭一层沙箱(bwrap 之类),
#    没搭就往上报 workspace-write 等于撒谎。
- id: bash-sandbox
  disabled: true

- id: permission
  config:
    presets:
      read-only:
        sandbox: read-only
        approval: ask
        name: '只读(文件工具)'
        description: '文件工具拒绝一切写入;shell 命令不受本机约束,风险操作仍会请求批准。'
      workspace-write:
        sandbox: workspace-write
        approval: ask
        name: '工作区可写(文件工具)'
        description: '文件工具只能写在当前工作区之内;shell 命令不受本机约束,风险操作仍会请求批准。'
      danger-full-access:
        sandbox: danger-full-access
        approval: never
        name: '完全放开'
        description: '文件工具不受限,且不询问批准。'
      remote-unconfined:
        sandbox: danger-full-access
        approval: ask
        name: '远程(默认:文件工具也放开)'
        description: '默认档。命令在远程机上以 root 运行、文件工具不施加围栏;风险操作仍会请求批准。'

- insert:
    - id: bash-sftp
      name: 'dsh-bash-sftp'
